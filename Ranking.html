<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Ranking - Rhythm Game</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght=300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="background.css">
<link rel="stylesheet" href="Home.css">
</head>

<body>

    <canvas id="rhythm-canvas"></canvas>
    <div class="vignette-overlay"></div>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-center"></div>

    <main class="page-container">

        <div class="page-header">
            <h1>GLOBAL RANKING</h1>
            <p>Nơi vinh danh những ngón tay thần tốc trên toàn thế giới</p>
        </div>

        <section class="glass-card" style="padding: 20px; overflow-x: auto;">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">HẠNG</th>
                        <th style="width: 35%;">PLAYER</th>
                        <th style="width: 25%;">TỔNG ĐIỂM (PR)</th>
                        <th style="width: 25%;">ĐỘ CHÍNH XÁC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="rank-badge rank-1">1</span></td>
                        <td class="text-neon">🚀 MuzikMaster_99</td>
                        <td><strong>12,450,800</strong></td>
                        <td class="text-accuracy">99.98%</td>
                    </tr>
                    <tr>
                        <td><span class="rank-badge rank-2">2</span></td>
                        <td>⚡ CyberChaser</td>
                        <td><strong>12,398,150</strong></td>
                        <td class="text-accuracy">99.85%</td>
                    </tr>
                    <tr>
                        <td><span class="rank-badge rank-3">3</span></td>
                        <td>🎵 Rhythm_God</td>
                        <td><strong>12,120,400</strong></td>
                        <td class="text-accuracy">99.54%</td>
                    </tr>
                    <tr>
                        <td><span style="padding-left: 10px;">4</span></td>
                        <td>NeonVibe_Dx</td>
                        <td><strong>11,950,000</strong></td>
                        <td class="text-accuracy">99.12%</td>
                    </tr>
                    <tr>
                        <td><span style="padding-left: 10px;">5</span></td>
                        <td>GlitchStriker</td>
                        <td><strong>11,885,320</strong></td>
                        <td class="text-accuracy">98.95%</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="background.js"></script>

</body>
</html>
