<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rhythm Game - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: white;
      overflow-x: hidden;
      background: #0f0f2d;
    }

    /* =========================================
        INTERACTIVE CANVAS BACKGROUND
    ========================================= */

    #rhythm-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: auto;
      background: #0f0f2d;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 50%, rgba(21, 21, 60, 0.1) 0%, rgba(10, 8, 28, 0.8) 100%);
      pointer-events: none;
    }

    .ambient-glow-1 {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.18) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(255, 0, 128, 0.15) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }

    .ambient-glow-center {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.12) 0%, transparent 60%);
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
    }

    /* =========================================
        NAVBAR
    ========================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      z-index: 999;
      transition: 0.4s ease;
    }

    .navbar.scrolled {
      background: rgba(15, 15, 45, 0.65);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      letter-spacing: 6px;
      font-weight: 700;
      color: white;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.6), 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.92rem;
      position: relative;
      transition: 0.3s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      transition: 0.3s ease;
    }

    .nav-links a:hover {
      color: white;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Nút điều hướng quay lại trang chủ */
    .home-nav-btn {
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: white;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s ease;
    }

    .home-nav-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 242, 254, 0.6);
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    /* =========================================
        HERO & GLOWING CARD
    ========================================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      z-index: 10;
    }

    .hero-content {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 520px;
      padding: 55px 40px;
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(0, 242, 254, 0.15),
        0 0 80px rgba(236, 72, 153, 0.1);
      animation: floatPanel 6s ease-in-out infinite;
    }

    .hero-content::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 40%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f2fe, #ec4899, transparent);
      animation: scanline 4.5s linear infinite;
    }

    .hero-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -180px;
      right: -150px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(236, 72, 153, 0.12) 50%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 5s ease infinite;
    }

    .hero-subtitle {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 35px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* =========================================
        FORM ELEMENTS
    ========================================= */

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: 0.35s ease;
      backdrop-filter: blur(10px);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .input-group input:focus {
      border-color: #00f2fe;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
      transform: translateY(-1px);
    }

    .input-group::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: 0;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #00f2fe, #ffffff, #ec4899);
      transition: 0.4s ease;
    }

    .input-group:focus-within::after {
      width: calc(100% - 36px);
    }

    /* =========================================
        LOGIN BUTTON
    ========================================= */

    .login-btn {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 18px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.45) 0%, rgba(236, 72, 153, 0.35) 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: 0.35s ease;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25), 0 0 50px rgba(236, 72, 153, 0.15);
      animation: buttonPulse 3s infinite;
    }

    .login-btn strong {
      letter-spacing: 4px;
      font-size: 1rem;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }

    .login-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      transition: 0.7s;
    }

    .login-btn:hover::before {
      left: 140%;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.8);
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.6) 0%, rgba(236, 72, 153, 0.5) 100%);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.5), 0 0 80px rgba(236, 72, 153, 0.3);
    }

    .register-text {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .register-text a {
      color: #00f2fe;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .register-text a:hover {
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
    }

    /* =========================================
        FOOTER
    ========================================= */

    footer {
      padding: 40px 20px;
      background: rgba(10, 8, 28, 0.8);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .footer-links {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      transition: 0.3s ease;
    }

    .footer-links a:hover {
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
    }

    /* =========================================
        ANIMATIONS
    ========================================= */

    @keyframes scanline {
      from { left: -50%; }
      to { left: 120%; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); }
      50% { box-shadow: 0 0 45px rgba(0, 242, 254, 0.45), 0 0 90px rgba(236, 72, 153, 0.3); }
    }

    @keyframes floatPanel {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>

<body>

  <canvas id="rhythm-canvas"></canvas>
  <div class="vignette-overlay"></div>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="ambient-glow-center"></div>

  <header class="navbar" id="navbar">
    <div class="logo">
      RHYTHM GAME
    </div>
    <nav class="nav-links">
      <a href="Home.html">Home</a>
      <a href="News.html">News</a>
      <a href="Music.html">Music</a>
      <a href="FAQ.html">FAQ</a>
      <a href="Home.html" class="home-nav-btn">HOME</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="hero-glow"></div>
      <p class="hero-subtitle">Login To Your Account</p>

      <form class="auth-form" id="loginForm">
        <div class="input-group">
          <input id="loginUsername" type="text" placeholder="Email or Username" required>
        </div>

        <div class="input-group">
          <input id="loginPassword" type="password" placeholder="Password" required>
        </div>

        <p id="messageText" style="text-align:center; font-size: 0.9rem; font-weight: 500;"></p>

        <button type="submit" class="login-btn">
          <strong>LOGIN</strong>
        </button>

        <p class="register-text">
          Chưa có tài khoản?
          <a href="#" id="showRegister">Đăng ký ngay</a>
        </p>
      </form>

      <form class="auth-form" id="registerForm" style="display:none;">
        <div class="input-group">
          <input id="registerUsername" type="text" placeholder="Username" required>
        </div>

        <div class="input-group">
          <input id="registerEmail" type="email" placeholder="Email" required>
        </div>

        <div class="input-group">
          <input id="registerPassword" type="password" placeholder="Password" required>
        </div>

        <p id="registerMessage" style="text-align:center; font-size: 0.9rem; font-weight: 500;"></p>

        <button type="submit" class="login-btn">
          <strong>REGISTER</strong>
        </button>

        <p class="register-text">
          Đã có tài khoản?
          <a href="#" id="showLogin">Đăng nhập</a>
        </p>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2026 Rhythm Game</p>
    <div class="footer-links">
      <a href="#">Twitter</a>
      <a href="#">YouTube</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    const canvas = document.getElementById('rhythm-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const mouse = { x: null, y: null, radius: 200 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Shard {
      constructor() {
        this.reset();
        this.y = Math.random() * height;
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 120 + 20;
        this.size = Math.random() * 18 + 10;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = -(Math.random() * 0.6 + 0.4);
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.006;
        this.opacity = Math.random() * 0.35 + 0.15;
        this.points = [];
        const numPoints = Math.floor(Math.random() * 3) + 3;
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          const radius = this.size * (0.7 + Math.random() * 0.5);
          this.points.push({ x: Math.cos(angle) * radius, y: Math.sin(angle) * radius });
        }
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;
        if (mouse.x !== null && mouse.y !== null) {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouse.radius) {
            const force = (mouse.radius - distance) / mouse.radius;
            this.x += (dx / distance) * force * 2.2;
            this.y += (dy / distance) * force * 2.2;
          }
        }
        if (this.y < -50 || this.x < -50 || this.x > width + 50) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        const gradient = ctx.createLinearGradient(-this.size, -this.size, this.size, this.size);
        gradient.addColorStop(0, `rgba(0, 242, 254, ${this.opacity})`);
        gradient.addColorStop(0.5, `rgba(236, 72, 153, ${this.opacity * 0.7})`);
        gradient.addColorStop(1, `rgba(255, 255, 255, ${this.opacity * 0.4})`);
        ctx.fillStyle = gradient;
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.65})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) {
          ctx.lineTo(this.points[i].x, this.points[i].y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    class StarParticle {
      constructor() {
        this.reset();
        this.y = Math.random() * height;
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + 10;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = -(Math.random() * 0.8 + 0.3);
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.5 + 0.3;
        this.glowColor = Math.random() > 0.5 ? '0, 242, 254' : '236, 72, 153';
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgba(${this.glowColor}, 0.8)`;
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    const shardCount = 26;
    const starCount = 40;
    const shards = [];
    const stars = [];
    for (let i = 0; i < shardCount; i++) shards.push(new Shard());
    for (let i = 0; i < starCount; i++) stars.push(new StarParticle());

    let waveOffset = 0;
    function drawRibbonWaves() {
      waveOffset += 0.0018;
      const waves = [
        { amplitude: 50, frequency: 0.0014, color: 'rgba(0, 242, 254, 0.12)', offsetAdd: 1 },
        { amplitude: 35, frequency: 0.0018, color: 'rgba(236, 72, 153, 0.1)', offsetAdd: 1.6 },
        { amplitude: 65, frequency: 0.001, color: 'rgba(0, 242, 254, 0.07)', offsetAdd: 0.6 },
        { amplitude: 28, frequency: 0.0025, color: 'rgba(255, 255, 255, 0.08)', offsetAdd: 2.2 }
      ];
      waves.forEach((w, index) => {
        ctx.strokeStyle = w.color;
        ctx.lineWidth = index === 0 ? 2 : 1.2;
        ctx.beginPath();
        for (let x = 0; x <= width; x += 10) {
          const sinY1 = Math.sin(x * w.frequency + waveOffset * w.offsetAdd);
          const sinY2 = Math.cos(x * (w.frequency * 0.4) - waveOffset * 0.7);
          const y = (height * 0.63) + (sinY1 + sinY2) * w.amplitude;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }

    let mouseGlowPulse = 0;
    function drawMouseGlow() {
      if (mouse.x === null || mouse.y === null) return;
      mouseGlowPulse += 0.03;
      const sizeFactor = Math.sin(mouseGlowPulse) * 15;
      const glowGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, mouse.radius + sizeFactor);
      glowGrad.addColorStop(0, 'rgba(0, 242, 254, 0.12)');
      glowGrad.addColorStop(0.4, 'rgba(236, 72, 153, 0.06)');
      glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, mouse.radius + sizeFactor, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      ctx.fillStyle = '#0f0f2d';
      ctx.fillRect(0, 0, width, height);
      stars.forEach(star => { star.update(); star.draw(); });
      drawRibbonWaves();
      drawMouseGlow();
      shards.forEach(shard => { shard.update(); shard.draw(); });
      requestAnimationFrame(animate);
    }

    window.onload = function () { animate(); };
  </script>

  <script>
    const baseURL = "http://localhost:5000/api/Auth/";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    document.getElementById("showRegister").onclick = function (e) {
      e.preventDefault();
      loginForm.style.display = "none";
      registerForm.style.display = "flex";
    };

    document.getElementById("showLogin").onclick = function (e) {
      e.preventDefault();
      registerForm.style.display = "none";
      loginForm.style.display = "flex";
    };

    // --- LOGIC FORM ĐĂNG NHẬP ---
    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const message = document.getElementById("messageText");
      message.style.color = "white";
      message.innerText = "Logging in...";

      const data = {
        Username: document.getElementById("loginUsername").value,
        Password: document.getElementById("loginPassword").value
      };

      try {
        const res = await fetch(baseURL + "login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const text = await res.text();

        if (res.ok) {
          message.style.color = "lightgreen";
          message.innerText = "Login successful!";
          
          // --- ĐOẠN ĐỒNG BỘ QUAN TRỌNG ĐÃ ĐƯỢC THÊM ---
          localStorage.setItem("CurrentUsername", data.Username);
          localStorage.setItem("isLoggedIn", "true"); // Kích hoạt "chìa khóa" cho trang Home.html nhận diện
          
          // Chuyển hướng về trang chủ sau khi lưu bộ nhớ thành công
          setTimeout(() => {
            window.location.href = "Home.html";
          }, 400);
        } else {
          message.style.color = "#ff4b4b";
          message.innerText = text || "Invalid username or password";
        }
      } catch (err) {
        message.style.color = "#ff4b4b";
        message.innerText = "Cannot connect to server!";
      }
    });

    // --- LOGIC FORM ĐĂNG KÝ ---
    registerForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const message = document.getElementById("registerMessage");
      message.style.color = "white";
      message.innerText = "Registering account...";

      const data = {
        Username: document.getElementById("registerUsername").value,
        Email: document.getElementById("registerEmail").value,
        Password: document.getElementById("registerPassword").value
      };

      try {
        const res = await fetch(baseURL + "register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const text = await res.text();

        if (res.ok) {
          message.style.color = "lightgreen";
          message.innerText = "Register successful! Please login.";
          setTimeout(() => {
            registerForm.style.display = "none";
            loginForm.style.display = "flex";
          }, 1000);
        } else {
          message.style.color = "#ff4b4b";
          message.innerText = text || "Register failed!";
        }
      } catch (err) {
        message.style.color = "#ff4b4b";
        message.innerText = "Cannot connect to server!";
      }
    });
  </script>
</body>

</html>
