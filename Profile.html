<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rhythm Game | Profile</title>

    <link rel="stylesheet" href="background.css">
<link rel="stylesheet" href="Home.css">
</head>

<body>

    <!-- Background -->
    <canvas id="rhythm-canvas"></canvas>

    <div class="vignette-overlay"></div>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-center"></div>

    <!-- Main Content -->
    <main class="page-container">

        <div class="page-header">
            <h1>PROFILE</h1>
            <p>Your Rhythm Journey</p>
        </div>

        <div class="profile-layout">

            <div class="glass-card profile-card">

                <div class="profile-avatar">
                    <img src="images/avatar.jpg" alt="Avatar">
                </div>

                <h2>Nguyen Player</h2>

                <span class="player-rank">
                    Diamond Rank
                </span>

            </div>

            <div class="glass-card profile-stats">

                <div class="stat-box">
                    <h3>Level</h3>
                    <span>57</span>
                </div>

                <div class="stat-box">
                    <h3>Accuracy</h3>
                    <span>98.72%</span>
                </div>

                <div class="stat-box">
                    <h3>Total Score</h3>
                    <span>5,289,400</span>
                </div>

                <div class="stat-box">
                    <h3>Play Count</h3>
                    <span>2,381</span>
                </div>

            </div>

        </div>

        <div class="glass-card recent-play">

            <h2>Recent Plays</h2>

            <table class="ranking-table">

                <tr>
                    <td>Fracture Ray</td>
                    <td>EX+</td>
                    <td>9,987,654</td>
                </tr>

                <tr>
                    <td>Halcyon</td>
                    <td>EX</td>
                    <td>9,854,210</td>
                </tr>

                <tr>
                    <td>Conflict</td>
                    <td>AA</td>
                    <td>9,102,333</td>
                </tr>

            </table>

        </div>

    </main>

    <!-- Background Script -->
    <script src="js/background.js"></script>

</body>

</html>
