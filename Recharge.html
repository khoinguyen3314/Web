<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game | Recharge Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="Home.css">
    
    <style>
        /* Unified Navbar Style */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            z-index: 999;
            transition: 0.4s ease;
        }

        .navbar.scrolled {
            background: rgba(15, 15, 45, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            letter-spacing: 6px;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.92rem;
            position: relative;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: white;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .auth-nav-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s ease;
        }

        /* Recharge UI Styles */
        .recharge-container {
            max-width: 1000px;
            margin: 120px auto 50px;
            padding: 0 20px;
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 24px;
            padding: 30px 40px;
            margin-bottom: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }

        .balance-info h2 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: #00f2fe;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .package-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .package-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .package-card:hover {
            transform: translateY(-10px);
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .package-card.popular {
            border-color: #ec4899;
        }

        .package-card.popular::before {
            content: "HOT";
            position: absolute;
            top: 15px;
            right: -30px;
            background: #ec4899;
            color: white;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-size: 0.7rem;
            font-weight: 800;
        }

        .package-icon { font-size: 3rem; margin-bottom: 20px; display: block; }
        .package-amount { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; display: block; }
        .package-desc { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 25px; display: block; }
        
        .package-price {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: 800;
            border: 1px solid rgba(0, 242, 254, 0.2);
            transition: 0.3s;
        }

        .package-card:hover .package-price {
            background: #00f2fe;
            color: #000;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #15153c;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header { text-align: center; margin-bottom: 30px; }
        .modal-header h3 { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #fff; }

        .payment-methods { display: flex; flex-direction: column; gap: 12px; }
        .method-btn {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 18px 25px;
            border-radius: 18px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .method-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: #00f2fe;
            transform: scale(1.02);
        }

        .method-btn img { width: 45px; height: 45px; object-fit: contain; }
        .method-name { font-weight: 700; font-size: 1rem; display: block; }
        .method-desc { font-size: 0.75rem; color: rgba(255,255,255,0.5); }

        .close-modal { position: absolute; top: 20px; right: 25px; background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; opacity: 0.5; }
        .close-modal:hover { opacity: 1; }

        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 45, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>

    <canvas id="rhythm-canvas"></canvas>
    <div class="vignette-overlay"></div>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-center"></div>

    <header class="navbar" id="navbar">
        <div class="logo">RHYTHM GAME</div>
        <nav class="nav-links">
            <a href="Home.html">HOME</a>
            <a href="News.html">NEWS</a>
            <a href="Music.html">MUSIC</a>
            <a href="FAQ.html">FAQ</a>
            <a href="#" class="auth-nav-btn" id="auth-btn">LOGIN</a>
        </nav>
    </header>

    <div class="recharge-container">
        <div class="page-header" style="text-align: center; margin-bottom: 50px;">
            <h1 style="font-family: 'Cinzel', serif; font-size: 3rem; letter-spacing: 8px; text-shadow: 0 0 20px rgba(0,242,254,0.3);">RECHARGE</h1>
            <p style="color: rgba(255,255,255,0.5); letter-spacing: 4px; font-size: 0.8rem; margin-top: 10px;">UPGRADE YOUR MUSICAL EXPERIENCE</p>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <h2>YOUR BALANCE</h2>
                <div class="balance-amount" id="user-balance">0 RC</div>
            </div>
            <div style="text-align: right;">
                <p style="color: rgba(255,255,255,0.4); font-size: 0.75rem; margin-bottom: 5px;">LOGGED IN AS</p>
                <p id="display-username" style="color: #00f2fe; font-weight: 800; font-size: 1.2rem;"></p>
            </div>
        </div>

        <div class="package-grid" id="package-list">
            <!-- Packages will be loaded here -->
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal" id="payment-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-header">
                <h3>SELECT PAYMENT METHOD</h3>
                <p id="selected-pkg-info" style="color: rgba(255,255,255,0.5); margin-top: 12px; font-size: 0.9rem;"></p>
            </div>
            
            <div class="payment-methods">
                <button class="method-btn" onclick="startPayment('vnpay')">
                    <img src="LogoBank/VNPay.png" alt="VNPay">
                    <div class="method-info">
                        <span class="method-name">VNPay / QR Code</span>
                        <span class="method-desc">Secure payment via VNPay gateway</span>
                    </div>
                </button>

                <button class="method-btn" onclick="startPayment('momo')">
                    <img src="LogoBank/Momo.png" alt="MoMo">
                    <div class="method-info">
                        <span class="method-name">MoMo Wallet</span>
                        <span class="method-desc">Instant payment via MoMo app</span>
                    </div>
                </button>

                <button class="method-btn" onclick="startPayment('momo_atm')">
                    <img src="LogoBank/Bank.png" alt="Bank ATM">
                    <div class="method-info">
                        <span class="method-name">ATM / Internet Banking</span>
                        <span class="method-desc">Pay via local bank accounts</span>
                    </div>
                </button>

                <button class="method-btn" onclick="startPayment('free')" id="free-method" style="display: none; border-color: #10b981;">
                    <span style="font-size: 1.8rem; margin-right: 15px;">🎁</span>
                    <div class="method-info">
                        <span class="method-name" style="color: #10b981;">Claim Free</span>
                        <span class="method-desc">Exclusive offer for new players</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Connecting to gateway...</p>
    </div>

    <script src="background.js"></script>
    <script>
        const API_BASE = "http://localhost:5000/api";
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        let currentUserId = localStorage.getItem("CurrentUsername");
        let selectedPackageId = null;

        if (!isLoggedIn || !currentUserId) {
            alert("Please login from the Home page first!");
            window.location.href = "Home.html";
        }

        document.getElementById('display-username').innerText = currentUserId.toUpperCase();

        // Sync Navbar Auth state
        const authBtn = document.getElementById('auth-btn');
        if (isLoggedIn) {
            authBtn.innerText = "LOGOUT";
            authBtn.style.borderColor = "rgba(255, 75, 75, 0.5)";
            authBtn.onclick = (e) => {
                e.preventDefault();
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('CurrentUsername');
                window.location.href = "Home.html";
            };
        }

        async function fetchBalance() {
            try {
                const res = await fetch(`${API_BASE}/user/balance`, {
                    headers: { 'x-user-id': currentUserId }
                });
                const data = await res.json();
                document.getElementById('user-balance').innerText = `${data.balance.toLocaleString()} RC`;
            } catch (err) {}
        }

        async function fetchPackages() {
            try {
                const res = await fetch(`${API_BASE}/packages`);
                const data = await res.json();
                const container = document.getElementById('package-list');
                container.innerHTML = '';

                data.packages.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = `package-card ${pkg.id === 'p3' || pkg.id === 'p4' ? 'popular' : ''}`;
                    card.onclick = () => openPaymentModal(pkg);

                    const isFree = pkg.price === 0;

                    card.innerHTML = `
                        <span class="package-icon">💎</span>
                        <span class="package-amount">${pkg.amount.toLocaleString()} RC</span>
                        <span class="package-desc">${pkg.description}</span>
                        <div class="package-price">
                            ${isFree ? 'FREE' : pkg.price.toLocaleString() + ' VND'}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {}
        }

        function openPaymentModal(pkg) {
            selectedPackageId = pkg.id;
            document.getElementById('selected-pkg-info').innerText = `Selected: ${pkg.name} (${pkg.amount} RC)`;
            document.getElementById('payment-modal').style.display = 'flex';
            
            const freeMethod = document.getElementById('free-method');
            freeMethod.style.display = pkg.price === 0 ? 'flex' : 'none';
        }

        document.getElementById('close-modal').onclick = () => {
            document.getElementById('payment-modal').style.display = 'none';
        };

        async function startPayment(provider) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            try {
                const res = await fetch(`${API_BASE}/payment/${provider}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ packageId: selectedPackageId, userId: currentUserId })
                });

                const data = await res.json();

                if (provider === 'free') {
                    overlay.style.display = 'none';
                    document.getElementById('payment-modal').style.display = 'none';
                    alert(data.message || "Claimed Successfully!");
                    fetchBalance();
                } else if (data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                } else {
                    throw new Error(data.message || "Payment Failed");
                }
            } catch (err) {
                overlay.style.display = 'none';
                alert("Error: " + err.message);
            }
        }

        // Initialize
        fetchBalance();
        fetchPackages();

        // Check URL for status
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('paymentStatus') === 'success') {
            alert("Recharge Successful! Thank you for your support.");
            window.history.replaceState({}, document.title, window.location.pathname);
            fetchBalance();
        }
    </script>
</body>

</html>
